name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.326

      - name: Validate marketplace and plugins
        run: claude plugin validate .

      # Every plugin shares the repo's release tag, so each plugin.json
      # version has to match it.
      - name: Check plugin versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          status=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            version="$(jq -r .version "$manifest")"
            if [ "$version" != "$tag_version" ]; then
              echo "::error file=$manifest::version is $version but the tag is $GITHUB_REF_NAME"
              status=1
            fi
          done
          exit $status
